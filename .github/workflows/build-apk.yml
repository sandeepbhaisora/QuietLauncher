name: Build Quiet APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test local intent router (JVM)
        run: |
          mkdir -p /tmp/quiet-intent-tests
          javac -d /tmp/quiet-intent-tests \
            app/src/main/java/dev/quiet/launcher/IntentRouter.java \
            app/src/test/java/dev/quiet/launcher/IntentRouterTest.java
          java -cp /tmp/quiet-intent-tests dev.quiet.launcher.IntentRouterTest
          javac -d /tmp/quiet-intent-tests \
            app/src/main/java/dev/quiet/launcher/IntentRouter.java \
            app/src/main/java/dev/quiet/launcher/ActionPolicy.java \
            app/src/test/java/dev/quiet/launcher/ActionPolicyTest.java
          java -cp /tmp/quiet-intent-tests dev.quiet.launcher.ActionPolicyTest
      - name: Test speech cleanup (JVM)
        run: |
          mkdir -p /tmp/quiet-speech-tests
          javac -d /tmp/quiet-speech-tests app/src/main/java/dev/quiet/launcher/SpeechTextCleaner.java app/src/test/java/dev/quiet/launcher/SpeechTextCleanerTest.java
          java -cp /tmp/quiet-speech-tests dev.quiet.launcher.SpeechTextCleanerTest
      - name: Assemble installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quiet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
