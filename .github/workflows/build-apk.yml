name: Build Quiet APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test local intent router (JVM)
        run: |
          mkdir -p /tmp/quiet-intent-tests
          javac -d /tmp/quiet-intent-tests \
            app/src/main/java/dev/quiet/launcher/IntentRouter.java \
            app/src/test/java/dev/quiet/launcher/IntentRouterTest.java
          java -cp /tmp/quiet-intent-tests dev.quiet.launcher.IntentRouterTest
          javac -d /tmp/quiet-intent-tests \
            app/src/main/java/dev/quiet/launcher/IntentRouter.java \
            app/src/main/java/dev/quiet/launcher/ActionPolicy.java \
            app/src/test/java/dev/quiet/launcher/ActionPolicyTest.java
          java -cp /tmp/quiet-intent-tests dev.quiet.launcher.ActionPolicyTest
      - name: Test speech cleanup (JVM)
        run: |
          mkdir -p /tmp/quiet-speech-tests
          javac -d /tmp/quiet-speech-tests app/src/main/java/dev/quiet/launcher/SpeechTextCleaner.java app/src/test/java/dev/quiet/launcher/SpeechTextCleanerTest.java
          java -cp /tmp/quiet-speech-tests dev.quiet.launcher.SpeechTextCleanerTest
      - name: Test Hindi speech normalization (JVM)
        run: |
          mkdir -p /tmp/quiet-hindi-tests
          javac -encoding UTF-8 -d /tmp/quiet-hindi-tests \
            app/src/main/java/dev/quiet/launcher/SpeechTextCleaner.java \
            app/src/main/java/dev/quiet/launcher/HindiSpeech.java \
            app/src/test/java/dev/quiet/launcher/HindiSpeechTest.java
          java -cp /tmp/quiet-hindi-tests dev.quiet.launcher.HindiSpeechTest
      - name: Test offline-first routing (JVM)
        run: |
          mkdir -p /tmp/quiet-routing-tests
          javac -encoding UTF-8 -d /tmp/quiet-routing-tests \
            app/src/main/java/dev/quiet/launcher/LondeCommands.java \
            app/src/main/java/dev/quiet/launcher/LocalFirstRouter.java \
            app/src/test/java/dev/quiet/launcher/LocalFirstRouterTest.java
          java -cp /tmp/quiet-routing-tests dev.quiet.launcher.LocalFirstRouterTest
      - name: Test Qwen-first fallback policy (JVM)
        run: |
          mkdir -p /tmp/quiet-qwen-tests
          javac -encoding UTF-8 -d /tmp/quiet-qwen-tests \
            app/src/main/java/dev/quiet/launcher/LocalReplyPolicy.java \
            app/src/test/java/dev/quiet/launcher/LocalReplyPolicyTest.java
          java -cp /tmp/quiet-qwen-tests dev.quiet.launcher.LocalReplyPolicyTest
      # Never expose a persistent signing key to pull requests.
      - name: Prepare permanent signing for main builds
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.QUIET_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.QUIET_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUIET_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QUIET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Permanent APK signing secrets are missing. See signing setup documentation."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/quiet-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/quiet-signing/quiet-upload.jks"
          chmod 600 "$RUNNER_TEMP/quiet-signing/quiet-upload.jks"
          echo "QUIET_KEYSTORE_FILE=$RUNNER_TEMP/quiet-signing/quiet-upload.jks" >> "$GITHUB_ENV"
          echo "QUIET_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "QUIET_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QUIET_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Set increasing build version
        run: echo "QUIET_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Install native offline Hindi neural voice runtime and model
        run: bash scripts/install_local_voice.sh
      - name: Install bundled offline Hey Londe keyword model
        run: bash scripts/install_londe_wake.sh
      - name: Assemble installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Delete temporary keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/quiet-signing"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quiet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
